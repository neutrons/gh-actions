name: grype-scan
description: Run Anchore Grype vulnerability scan and upload SARIF results
author: peterfpeterson
branding:
  icon: shield
  color: red

inputs:
  path:
    description: Path to scan (e.g. conda environment directory)
    required: true
  fail-build:
    description: Fail the build if vulnerabilities are found
    required: false
    default: "false"
  only-fixed:
    description: Only report vulnerabilities that have a fix available
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Run the Anchore Grype scan action
      uses: anchore/scan-action@v7
      id: scan
      with:
        path: ${{ inputs.path }}
        fail-build: ${{ inputs.fail-build }}
        only-fixed: ${{ inputs.only-fixed }}
    - name: Upload vulnerability report
      uses: github/codeql-action/upload-sarif@v4
      if: ${{ success() || failure() }}
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
    - name: Inspect action SARIF report
      if: ${{ runner.debug == true }}
      shell: bash
      run: cat ${{ steps.scan.outputs.sarif }}
