name: conda-cleanup
description: Remove old packages of a specific label from anaconda.org
author: neutrons
branding:
  icon: trash-2
  color: red

inputs:
  anaconda_token:
    description: Anaconda.org API token
    required: true
  organization:
    description: Anaconda.org organization or user name
    required: true
  package_name:
    description: Name of the conda package to clean up
    required: true
  label:
    description: |
      Label to target for cleanup (e.g., dev, nightly, rc)
    required: false
    default: "dev"
  keep:
    description: Number of most recent package versions to keep
    required: false
    default: "5"
  dry_run:
    description: If true, only print what would be deleted without actually deleting
    required: false
    default: "false"

outputs:
  num_removed:
    description: "Number of files that would be deleted"
    value: ${{ steps.remove_pkg.outputs.num_removed }}

runs:
  using: "composite"
  steps:
    - name: Ensure anaconda command
      id: get_command
      shell: bash
      run: |
        CMD_PATH=""

        if ! command -v anaconda &>/dev/null && ! command -v pixi &>/dev/null; then
          echo "Neither 'anaconda' command nor 'pixi' is available."
          echo "Please ensure that anaconda-client is installed and available in PATH or via pixi."
          exit 1
        fi

        if command -v anaconda &>/dev/null; then
          CMD_PATH=$(command -v anaconda)
          echo "Using 'anaconda' command at ${CMD_PATH}"
        elif command -v pixi &>/dev/null; then
          echo "'pixi' command is available but not 'anaconda'. Installing anaconda-client via pixi."
          pixi global install anaconda-client

          export PATH="${PIXI_HOME:-${HOME}/.pixi}/bin:${PATH}"
          echo "${PIXI_HOME:-${HOME}/.pixi}/bin" >> "$GITHUB_PATH"
          hash -r

          for candidate in anaconda binstar conda-server; do
            if command -v "${candidate}" &>/dev/null; then
              CMD_PATH=$(command -v "${candidate}")
              break
            fi
          done
          echo "Using installed anaconda-client command at ${CMD_PATH}"
        fi

        if [ -z "${CMD_PATH:-}" ]; then
          echo "anaconda-client was installed but no supported executable"
          echo "(anaconda, binstar, conda-server) was found in PATH."
          exit 1
        fi
        echo "CMD=${CMD_PATH}" >> $GITHUB_OUTPUT

    - name: Remove old labeled packages
      id: remove_pkg
      shell: bash
      env:
        ANACONDA_API_TOKEN: ${{ inputs.anaconda_token }}
        ORGANIZATION: ${{ inputs.organization }}
        PACKAGE_NAME: ${{ inputs.package_name }}
        LABEL: ${{ inputs.label }}
        KEEP: ${{ inputs.keep }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |

        set -euo pipefail

        CMD="${{ steps.get_command.outputs.CMD }}"
        if [ -z "${CMD}" ]; then
          echo "No output detected from previous step."
          exit 1
        fi

        ### DEBUG BLOCK ###
        if [ -z "${ANACONDA_API_TOKEN:-}" ]; then
          echo "ANACONDA_API_TOKEN is empty. anaconda-client silently omits the"
          echo "Authorization header when the token is blank, which results in a"
          echo "confusing 401 Unauthorized error from the Anaconda.org API."
          echo "Please ensure the 'anaconda_token' input is set to a valid,"
          echo "non-empty token (e.g. check that the referenced secret exists"
          echo "and is available in this workflow's context)."
          exit 1
        fi
        ### END DEBUG BLOCK ### 

        ANACONDA_URL="https://api.anaconda.org/package/"
        ANACONDA_URL="${ANACONDA_URL}${{ env.ORGANIZATION }}/${{ env.PACKAGE_NAME }}"

        RAW_RESULT=$(curl --max-time 5.5 -s "${ANACONDA_URL}")
        if [ -z "${RAW_RESULT}" ]; then
          echo "Curl returned empty result"
          exit 1
        fi

        echo "::group::Raw result from Anaconda API"
        echo "${RAW_RESULT}"
        echo "::endgroup::"

        FILES_TO_REMOVE=$(echo "${RAW_RESULT}" \
          | jq -r '
            [.files[] | select(.labels | index("${{ env.LABEL }}"))]
            | group_by(.version)
            | map({
                version: .[0].version,
                upload_time: (map(.upload_time) | max),
                files: [.[].full_name]
              })
            | sort_by(.upload_time)
            | reverse
            | .[${{ env.KEEP }}:]
            | .[].files[]
          ')
        echo "::group::Files to remove"
        echo "${FILES_TO_REMOVE}"
        echo "::endgroup::"

        echo "::group::Removing old files"
        echo "dry-run=${{ env.DRY_RUN }}"

        # count how many files are removed
        num_removed=0

        if [ -z "${FILES_TO_REMOVE}" ]; then
          echo "No old files to remove from ${{ env.LABEL }}"
          # write out number of packages that should have been deleted
        else
          echo "Removing old ${{ env.LABEL }} files"
          for FILE in ${FILES_TO_REMOVE}; do
            echo "Removing ${FILE}"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "Remove command: '\"${CMD}\" remove --force \"${FILE}\"'"
            else
              "${CMD}" remove --force "${FILE}"
            fi
            num_removed=$((num_removed+1))
          done
        fi

        # summarize what happened and write output variables
        echo "num_removed=${num_removed}"
        echo "num_removed=${num_removed}" >> $GITHUB_OUTPUT
        echo "::endgroup::"
